<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Nunito for child-friendly aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#00B4D8',
              yellow: '#FFB703',
              orange: '#FB8500',

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #E2F1F8;
      background-image: radial-gradient(#2A9D8F 0.75px, transparent 0.75px), radial-gradient(#2A9D8F 0.75px, #E2F1F8 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      overflow-x: hidden;
    }

    .font-heading {
      font-family: 'Fredoka', cursive;
    }

    .cartoon-box {
      border: 4px solid #1D3557;
      box-shadow: 6px 6px 0px #1D3557;
      border-radius: 1.5rem;
    }

    .cartoon-btn {
      border: 3px solid #1D3557;
      box-shadow: 4px 4px 0px #1D3557;
      transition: all 0.15s ease-in-out;
    }

    .cartoon-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #1D3557;
    }

    .cartoon-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #1D3557;
    }

    .badge-glow {
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 183, 3, 0.6)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(255, 183, 3, 0.9)); }
    }

    .slide-enter {
      animation: fadeInSlide 0.4s ease-out forwards;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen text-brand-darkNavy flex flex-col justify-between select-none">

  <header class="w-full bg-white/90 backdrop-blur-md border-b-4 border-brand-darkNavy p-3 md:px-6 sticky top-0 z-50">

        <!-- Quick Jump Drawer Toggle Button -->

  <!-- Slide Navigation Drawer (Hidden Modal) -->

    <div class="bg-white w-full max-w-xs md:max-w-md h-full border-l-4 border-brand-darkNavy p-5 overflow-y-auto flex flex-col justify-between">

          <button onclick="goToSlide(2)" class="w-full text-left p-2.5 rounded-xl border-2 border-brand-darkNavy bg-teal-50 hover:bg-teal-100 font-bold text-xs flex items-center justify-between">

          <button onclick="goToSlide(12)" class="p-2 rounded-xl border-2 border-brand-darkNavy bg-orange-50 hover:bg-orange-100 font-bold text-xs text-left">Kasus 5: Hasil Laut</button>

          <button onclick="goToSlide(14)" class="p-2 rounded-xl border-2 border-brand-darkNavy bg-orange-50 hover:bg-orange-100 font-bold text-xs text-left">Kasus 7: Daging Kotor</button>
          <button onclick="goToSlide(15)" class="p-2 rounded-xl border-2 border-brand-darkNavy bg-orange-50 hover:bg-orange-100 font-bold text-xs text-left">Kasus 8: Bumbu Impor</button>
          <button onclick="goToSlide(16)" class="p-2 rounded-xl border-2 border-brand-darkNavy bg-orange-50 hover:bg-orange-100 font-bold text-xs text-left">Kasus 9: Makan Berlebih</button>
          <button onclick="goToSlide(17)" class="p-2 rounded-xl border-2 border-brand-darkNavy bg-orange-50 hover:bg-orange-100 font-bold text-xs text-left">Kasus 10: Pewarna Tekstil</button>
        </div>

        <button onclick="goToSlide(18)" class="w-full text-left p-2.5 rounded-xl border-2 border-brand-darkNavy bg-purple-100 hover:bg-purple-200 font-bold text-xs flex items-center justify-between">

        </button>
      </div>

      <div class="mt-4 pt-4 border-t-2 border-gray-200 text-center">
        <p class="text-xs text-gray-500 font-semibold">Dikembangkan untuk SD Kelas 6</p>

  <main class="max-w-5xl mx-auto px-4 py-4 md:py-6 flex-grow w-full flex flex-col justify-center">
    <div id="slide-viewport" class="cartoon-box bg-white p-4 sm:p-6 md:p-8 min-h-[500px] flex flex-col justify-between relative overflow-hidden">
      <!-- Dynamic Slide Contents Rendered Here -->
      <div id="slide-content" class="w-full h-full my-auto"></div>
    </div>
  </main>

  <footer class="w-full bg-white border-t-4 border-brand-darkNavy p-3 md:px-6">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <button id="btn-prev" onclick="prevSlide()" class="cartoon-btn bg-gray-200 hover:bg-gray-300 text-brand-darkNavy font-heading font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm sm:text-base">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Sebelumnya</span>
      </button>

      <div class="flex items-center gap-2">
        <button id="btn-audio" onclick="toggleAudioPrompt()" class="cartoon-btn bg-sky-100 hover:bg-sky-200 text-brand-darkNavy p-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5" title="Baca Teks Suara">
          <i class="fa-solid fa-volume-high text-brand-teal text-lg"></i>
          <span class="hidden sm:inline font-heading">Suara</span>
        </button>
      </div>

      <button id="btn-next" onclick="nextSlide()" class="cartoon-btn bg-brand-teal hover:bg-cyan-500 text-white font-heading font-bold px-5 py-2.5 rounded-xl flex items-center gap-2 text-sm sm:text-base">
        <span>Berikutnya</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

  <!-- Audio / Audio Synthesis Controller -->
  <script>
    let currentSlide = 1;
    const totalSlides = 18;
    let scores = {}; // Stores answers for Cases 1 to 10
    let currentAudioUtterance = null;

    // Cases Answers Mapping (Shifted to slides 8-17)
    const correctAnswers = {
      8: 'B',  // Kasus 1: Pork Gelatin
      9: 'C',  // Kasus 2: Mangga Tetangga
      10: 'B', // Kasus 3: Syarat Sembelih
      11: 'C', // Kasus 4: Alkohol
      12: 'B', // Kasus 5: Hasil Laut
      13: 'C', // Kasus 6: Logo Halal
      14: 'B', // Kasus 7: Daging Kotor
      15: 'C', // Kasus 8: Bumbu Impor
      16: 'B', // Kasus 9: Thayyib Konsumsi
      17: 'B'  // Kasus 10: Problem Solving
    };

    function toggleMenu() {
      const menu = document.getElementById('slide-menu');
      menu.classList.toggle('hidden');
    }

    function goToSlide(slideNum) {
      currentSlide = slideNum;
      renderSlide();
      const menu = document.getElementById('slide-menu');
      if(!menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide();
      }
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function toggleAudioPrompt() {
      if (!('speechSynthesis' in window)) {
        alert("Maaf, peramban web kamu tidak mendukung fitur pembaca suara.");
        return;
      }

      if (window.speechSynthesis.speaking) {
        stopSpeech();
        return;
      }

      // Extract readable text from slide-content
      const slideElem = document.getElementById('slide-content');
      let cleanText = slideElem.innerText || slideElem.textContent;
      
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'id-ID';
      utterance.rate = 0.95;
      utterance.pitch = 1.1;

      window.speechSynthesis.speak(utterance);
    }

    function renderSlide() {
      stopSpeech();
      const container = document.getElementById('slide-content');
      const indicator = document.getElementById('slide-indicator');
      const scoreBadge = document.getElementById('score-badge');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      // Update Navigation Status
      indicator.innerText = `Slide ${currentSlide} / ${totalSlides}`;
      btnPrev.disabled = (currentSlide === 1);
      btnPrev.classList.toggle('opacity-50', currentSlide === 1);
      btnPrev.classList.toggle('cursor-not-allowed', currentSlide === 1);

      if (currentSlide >= 8 && currentSlide <= 17) {
        scoreBadge.classList.remove('hidden');
        updateScoreDisplay();
      } else {
        scoreBadge.classList.add('hidden');
      }

      // Hide Next button on last slide
      if (currentSlide === totalSlides) {
        btnNext.classList.add('hidden');
      } else {
        btnNext.classList.remove('hidden');
      }

      container.className = "w-full h-full slide-enter flex flex-col justify-center";

      switch (currentSlide) {
        case 1:
          container.innerHTML = `
            <div class="text-center py-4 space-y-6">
              <div class="inline-block bg-brand-yellow/30 px-4 py-1.5 rounded-full border-2 border-brand-darkNavy text-brand-darkNavy font-bold text-sm">
                🌟 Modul Digital Pembelajaran Agama Islam & Budi Pekerti
              </div>
              
              <h1 class="font-heading text-3xl sm:text-5xl font-extrabold text-brand-darkNavy leading-tight tracking-wide">
                Makanan & Minuman yang <br/>
                <span class="text-brand-orange underline decoration-wavy decoration-brand-yellow">Halal dan Thayyib</span>
              </h1>

              <div class="flex flex-wrap justify-center items-center gap-4 py-2">
                <span class="text-5xl sm:text-6xl hover:scale-125 transition-transform cursor-pointer" title="Ayam Goreng">🍗</span>
                <span class="text-5xl sm:text-6xl hover:scale-125 transition-transform cursor-pointer" title="Ikan">🐟</span>
                <span class="text-5xl sm:text-6xl hover:scale-125 transition-transform cursor-pointer" title="Susu Segar">🥛</span>
                <span class="text-5xl sm:text-6xl hover:scale-125 transition-transform cursor-pointer" title="Buah Segar">🍎</span>
                <span class="text-5xl sm:text-6xl hover:scale-125 transition-transform cursor-pointer" title="Sayur"> 🥦</span>
              </div>

              <div class="bg-brand-softBg cartoon-box p-4 max-w-md mx-auto">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Disusun Oleh:</p>
                <p class="font-heading text-xl font-bold text-brand-teal mt-1">Adam Faudy</p>
                <p class="text-xs text-brand-darkNavy font-semibold mt-0.5">Guru Pendidikan Agama Islam SD Kelas 6</p>
              </div>

              <button onclick="nextSlide()" class="cartoon-btn bg-brand-orange hover:bg-orange-600 text-white font-heading text-lg font-bold px-8 py-3.5 rounded-2xl inline-flex items-center gap-3">
                <span>Mulai Belajar</span>
                <i class="fa-solid fa-circle-play text-xl"></i>
              </button>
            </div>
          `;
          break;

        case 2:
          container.innerHTML = `
            <div class="space-y-4">
              <div class="flex items-center gap-3 border-b-4 border-brand-yellow pb-3">
                <div class="w-12 h-12 bg-brand-yellow text-brand-darkNavy rounded-2xl border-2 border-brand-darkNavy flex items-center justify-center text-2xl font-bold">
                  🎯
                </div>
                <div>
                  <h2 class="font-heading text-2xl font-bold text-brand-darkNavy">Tujuan Pembelajaran</h2>
                  <p class="text-xs text-gray-600 font-semibold">Target Capaian Pembelajaran Siswa</p>
                </div>
              </div>

              <p class="text-xs sm:text-sm font-semibold text-gray-700 bg-amber-50 p-3 rounded-xl border border-amber-200">
                Setelah mempelajari modul interaktif ini, peserta didik diharapkan mampu:
              </p>

              <!-- Target Grid -->
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
                <div class="bg-emerald-50 cartoon-box p-4 flex flex-col justify-between hover:bg-emerald-100 transition-colors">
                  <div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-xl font-bold border border-brand-darkNavy mb-3">
                      1
                    </div>
                    <h3 class="font-heading text-base font-bold text-emerald-900 mb-1">Memahami Ketentuan Islam</h3>
                    <p class="text-xs text-gray-700 font-medium leading-relaxed">
                      Memahami ketentuan Islam tentang makanan dan minuman yang halal dan haram (pengertian halal & thayyib, halal zatnya, cara memperolehnya, dan cara mengolahnya) dengan benar.
                    </p>
                  </div>
                  <div class="mt-3 pt-2 border-t border-emerald-200 text-emerald-800 text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Syariat & Hukum</span>
                  </div>
                </div>

                <div class="bg-sky-50 cartoon-box p-4 flex flex-col justify-between hover:bg-sky-100 transition-colors">
                  <div>
                    <div class="w-10 h-10 rounded-xl bg-brand-teal text-white flex items-center justify-center text-xl font-bold border border-brand-darkNavy mb-3">
                      2
                    </div>
                    <h3 class="font-heading text-base font-bold text-brand-darkNavy mb-1">Mengidentifikasi & Memeriksa</h3>
                    <p class="text-xs text-gray-700 font-medium leading-relaxed">
                      Menjelaskan cara mengidentifikasi makanan dan minuman halal dan haram, termasuk ciri makanan thayyib serta cara memeriksa logo halal resmi pada kemasan.
                    </p>
                  </div>
                  <div class="mt-3 pt-2 border-t border-sky-200 text-brand-teal text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Analisis & Ciri Pangan</span>
                  </div>
                </div>

                <div class="bg-purple-50 cartoon-box p-4 flex flex-col justify-between hover:bg-purple-100 transition-colors">
                  <div>
                    <div class="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center text-xl font-bold border border-brand-darkNavy mb-3">
                      3
                    </div>
                    <h3 class="font-heading text-base font-bold text-purple-900 mb-1">Mengambil Hikmah Kebiasaan</h3>
                    <p class="text-xs text-gray-700 font-medium leading-relaxed">
                      Mengambil hikmah dan manfaat dari mengonsumsi makanan dan minuman yang halal dan thayyib dalam kehidupan sehari-hari.
                    </p>
                  </div>
                  <div class="mt-3 pt-2 border-t border-purple-200 text-purple-800 text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-heart"></i>
                    <span>Penerapan Sehari-hari</span>
                  </div>
                </div>
              </div>
            </div>
          `;
          break;

        case 3:
          container.innerHTML = `
            <div class="space-y-5">
              <div class="flex items-center gap-3 border-b-4 border-brand-yellow pb-3">
                <div class="w-12 h-12 bg-teal-500 text-white rounded-2xl border-2 border-brand-darkNavy flex items-center justify-center text-2xl font-bold">
                  1
                </div>
                <div>
                  <h2 class="font-heading text-2xl font-bold text-brand-darkNavy">Pengantar: Perintah Allah SWT</h2>
                  <p class="text-xs text-gray-600 font-semibold">Belajar Surah Al-Maidah Ayat 88</p>
                </div>
              </div>

              <!-- Quranic Verse Box -->
              <div class="bg-amber-50 border-3 border-brand-darkNavy rounded-2xl p-5 text-right shadow-sm">
                <p class="font-serif text-2xl sm:text-3xl font-bold text-gray-800 leading-relaxed mb-3" dir="rtl">
                  وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا ۚ وَاتَّقُوا اللَّهَ الَّذِي أَنْتُمْ بِهِ مُؤْمِنُونَ
                </p>
                <p class="text-xs sm:text-sm font-semibold text-gray-700 text-left bg-white p-3 rounded-xl border border-amber-200">
                  <span class="font-bold text-brand-orange">Artinya:</span> "Dan makanlah dari apa yang telah diberikan Allah kepadamu sebagai rezeki yang <b>halal lagi baik (thayyib)</b>, dan bertakwalah kepada Allah yang kamu beriman kepada-Nya." (Q.S. Al-Ma'idah: 88)

      const container = document.getElementById('slide-content');

      const correct = correctAnswers[caseNum];

        let btnColor = "bg-white hover:bg-amber-50 border-brand-darkNavy text-brand-darkNavy";

        if (selected) {
          if (opt.code === correct) {
            btnColor = "bg-emerald-100 border-emerald-600 text-emerald-900 font-bold";
            iconHtml = `<span class="w-7 h-7 rounded-lg bg-emerald-500 text-white font-bold flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span>`;
          } else if (opt.code === selected && selected !== correct) {
            btnColor = "bg-rose-100 border-rose-600 text-rose-900 font-bold";
            iconHtml = `<span class="w-7 h-7 rounded-lg bg-rose-500 text-white font-bold flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></span>`;
          } else {
            btnColor = "bg-gray-100 border-gray-300 text-gray-400 opacity-60";
          }
        }

        return `
          <button 
            onclick="answerCase(${caseNum}, '${opt.code}')"
            ${selected ? 'disabled' : ''}
            class="w-full text-left p-3 rounded-xl border-2 cartoon-btn transition-all flex items-center gap-3 ${btnColor}">
            ${iconHtml}
            <span class="text-xs sm:text-sm font-semibold">${opt.text}</span>
          </button>
        `;
      }).join('');

      let feedbackBlock = '';
      if (selected) {
        const isRight = (selected === correct);
        feedbackBlock = `
          <div class="mt-4 p-4 rounded-xl border-2 ${isRight ? 'bg-emerald-50 border-emerald-500 text-emerald-900' : 'bg-rose-50 border-rose-500 text-rose-900'} slide-enter">
            <div class="flex items-center gap-2 font-heading font-bold text-sm mb-1">
              <i class="fa-solid ${isRight ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} text-lg"></i>
              <span>${isRight ? 'Luar Biasa! Analisis Detektif Tepat!' : 'Kurang Tepat, Detektif! Coba Pahami Ulang:'}</span>
            </div>
            <p class="text-xs font-semibold leading-relaxed">${explanation}</p>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <!-- Case Header -->
          <div class="flex items-center justify-between border-b-4 border-brand-orange pb-2">
            <div>
              <span class="bg-brand-orange text-white font-heading text-xs font-bold px-2.5 py-0.5 rounded-md border border-brand-darkNavy">
                MISI ${caseNum - 7} / 10
              </span>
              <h2 class="font-heading text-xl sm:text-2xl font-bold text-brand-darkNavy mt-1">${title}</h2>
            </div>
            <div class="text-3xl">🔍</div>
          </div>

          <!-- Scenario Card -->
          <div class="bg-amber-50 cartoon-box p-3.5 sm:p-4 text-xs sm:text-sm text-gray-800 leading-relaxed">
            <p class="font-bold text-brand-orange mb-1">📜 Deskripsi Skenario Lapangan:</p>
            <p>${scenario}</p>
          </div>

          <!-- Question -->
          <p class="font-heading font-bold text-sm sm:text-base text-brand-darkNavy">
            ❓ Pertanyaan: ${question}
          </p>

          <!-- Options -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${optionsHtml}
          </div>

          <!-- Feedback Block -->
          ${feedbackBlock}
        </div>
      `;
    }

    function answerCase(caseNum, optCode) {
      scores[caseNum] = optCode;
      updateScoreDisplay();

      // Trigger celebratory confetti if correct answer
      if (optCode === correctAnswers[caseNum]) {
        confetti({
          particleCount: 40,
          spread: 60,
          origin: { y: 0.7 }
        });
      }

      renderSlide();
    }

    function updateScoreDisplay() {
      let rightCount = 0;
      for (let i = 8; i <= 17; i++) {
        if (scores[i] && scores[i] === correctAnswers[i]) {
          rightCount++;
        }
      }
      document.getElementById('star-count').innerText = `${rightCount} / 10 Star`;
    }

    function renderCertificateSlide(container) {
      let rightCount = 0;
      for (let i = 8; i <= 17; i++) {
        if (scores[i] && scores[i] === correctAnswers[i]) {
          rightCount++;
        }
      }

      const scorePercent = Math.round((rightCount / 10) * 100);

      // Trigger Confetti Celebration
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.5 }
      });

      container.innerHTML = `
        <div class="space-y-5 text-center">
          <div class="inline-block bg-purple-100 text-brand-purple font-heading font-bold px-4 py-1 rounded-full border-2 border-brand-darkNavy text-xs uppercase tracking-wider">
            🎓 Sertifikat Kelulusan Modul
          </div>

          <!-- Certificate Frame -->
          <div id="certificate-card" class="bg-gradient-to-b from-amber-50 to-orange-50 border-8 border-brand-yellow rounded-3xl p-6 cartoon-box max-w-2xl mx-auto relative overflow-hidden shadow-2xl">
            <!-- Decorative Badges -->
            <div class="absolute top-3 left-3 text-2xl">🎖️</div>
            <div class="absolute top-3 right-3 text-2xl">🌟</div>

            <h2 class="font-heading text-2xl sm:text-3xl font-extrabold text-brand-darkNavy tracking-wide">
              SERTIFIKAT KELULUSAN
            </h2>
            <p class="text-xs font-bold text-gray-500 tracking-widest uppercase mt-1">Lencana Detektif Halal Cilik</p>

            <div class="my-4 py-2 border-y-2 border-dashed border-amber-300">
              <p class="text-xs font-semibold text-gray-600">Diberikan Kepada Siswa Hebat Kelas 6 SD:</p>
              <input id="student-name" type="text" placeholder="[ Ketik Nama Kamu Di Sini ]" class="font-heading text-xl sm:text-2xl font-bold text-brand-orange text-center bg-transparent border-b-2 border-brand-orange focus:outline-none w-full max-w-md my-2" value="Siswa Pembelajar PAI" />
              <p class="text-xs text-gray-700 font-medium">Telah menyelesaikan seluruh modul & game simulasi kasus dengan nilai:</p>
              
              <div class="inline-flex items-center gap-2 mt-2 bg-white px-5 py-2 rounded-2xl border-2 border-brand-darkNavy shadow-sm">
                <span class="text-3xl">⭐</span>
                <span class="font-heading text-2xl font-black text-brand-teal">${scorePercent} / 100</span>
                <span class="text-xs font-bold text-gray-500">(${rightCount} Kasus Tepat)</span>
              </div>
            </div>

            <p class="text-xs text-gray-600 font-semibold italic">
              "Semoga ilmu tentang makanan Halalan Thayyiban ini senantiasa diamalkan dalam kehidupan sehari-hari."
            </p>

            <div class="mt-4 pt-3 flex justify-between items-center text-left border-t border-amber-200 text-[10px] sm:text-xs text-gray-500 font-bold">
              <div>
                <p>Modul: PAI & BP SD Kelas 6</p>
                <p>Tema: Makanan Halal & Thayyib</p>
              </div>
              <div class="text-right">
                <p class="font-heading text-brand-darkNavy text-xs">Penyusun: Adam Faudy</p>
                <p>Guru Agama Islam</p>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-wrap justify-center gap-3 pt-2">
            <button onclick="window.print()" class="cartoon-btn bg-brand-green hover:bg-emerald-600 text-white font-heading font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm flex items-center gap-2">
              <i class="fa-solid fa-print"></i>
              <span>Cetak Sertifikat</span>
            </button>
            
            <button onclick="goToSlide(1)" class="cartoon-btn bg-brand-yellow hover:bg-yellow-400 text-brand-darkNavy font-heading font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm flex items-center gap-2">
              <i class="fa-solid fa-rotate-left"></i>
              <span>Ulangi Pembelajaran</span>
            </button>
          </div>
        </div>
      `;
    }

    // Initialize application on window load
    window.onload = function() {
      renderSlide();
    };
  </script>
</body>
</html>
